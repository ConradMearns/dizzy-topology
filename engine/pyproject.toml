[project]
name = "dizzy-topology-engine"
version = "0.1.0"
description = "The topology engine: runs a DIZZY feature across lanes and process pools over the Simple Engine store format"
requires-python = ">=3.11"
authors = [{ name = "Conrad Mearns", email = "conradmearns@pm.me" }]
# A RUN-time package. It builds on what `dizzy generate` vendors into every app
# (dizzy-kit, dizzy-engine) and must never depend on DIZZY itself.
dependencies = [
    "dizzy-kit",
    "dizzy-engine",
    "pydantic>=2",
]

[tool.uv.sources]
dizzy-kit = { workspace = true }
dizzy-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dizzy_topology_engine"]
