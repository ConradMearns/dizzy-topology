description: >-
  foogle_shindig with its fan-out work on process pools: every fold, every policy and
  every reader of a model the log folds stays on the inline main lane (rules 1, 3, 6);
  the snarf pokes, which read only the read-only gronk_values reference table, go to one
  pool; the snarf ratings — most of the 1024 commands — to a wide pool; and the foogle
  pipeline to a narrow one.
read_only_models: [gronk_values]
groups:
  - name: main
    catch_all: true
  - name: pokes
    include:
      - {kind: procedures, names: [poke_snarf]}
    executor: pool
    workers: 3
  - name: ratings
    include:
      - {kind: procedures, names: [rate_snarf]}
    executor: pool
    workers: 4
  - name: foogles
    include:
      - {kind: procedures, names: [toss_foogle, sniff_foogle, shred_foogle]}
    executor: pool
    workers: 2
priority:
  interactive: [throw_shindig]
