# Workspace root. Two packages, on opposite sides of the build/run line:
#
#   topology/  dizzy-topology         BUILD time. Reads a feature-file and topology.yaml,
#                                     validates the placement, resolves it to placement
#                                     data. Depends on DIZZY.
#   engine/    dizzy-topology-engine  RUN time. Executes a resolved placement over the
#                                     Simple Engine store format. A runtime dependency of
#                                     apps built on DIZZY; never depends on DIZZY itself.
#
# DIZZY is vendored as a git submodule at ext/dizzy; its commit pointer is the pin. Its
# build tool is installed editable for topology/. Its runtime packages (dizzy-kit,
# dizzy-engine) are copied into vendor/python/ by `just vendor`, exactly as
# `dizzy generate wiring` copies them into an app's lib/python-uv/, so the engine sits
# beside the code an app actually runs. (They cannot be members in place: uv stops at
# ext/dizzy, a non-workspace project, and their `workspace = true` sources fail.)
[project]
name = "dizzy-topology-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false
# DIZZY's generated LinkML pydantic models (feat_schema.py) break on pydantic 2.14
# (`treat_empty_lists_as_none` model_serializer raises on model_dump). DIZZY's own lock
# pins 2.12.4 while declaring `pydantic>=2.0`, so a fresh resolve here finds the break.
# Drop this once DIZZY bounds or fixes it upstream.
constraint-dependencies = ["pydantic<2.13"]

[tool.uv.workspace]
members = [
    "topology",
    "engine",
    "vendor/python/dizzy-kit",
    "vendor/python/dizzy-engine",
]

[tool.uv.sources]
dizzy = { path = "ext/dizzy", editable = true }
dizzy-topology = { workspace = true }
dizzy-topology-engine = { workspace = true }

[dependency-groups]
dev = [
    "dizzy-topology",
    "dizzy-topology-engine",
    "pytest>=8.4.2",
    "syrupy>=4.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["topology/tests", "engine/tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "ext",
    "vendor",
    # Generated by `just gen-topology-pydantic` — edit def/topology.yaml instead.
    "topology/src/dizzy_topology/topology_schema.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["dizzy_topology", "dizzy_topology_engine"]
