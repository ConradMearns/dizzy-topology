# Workspace root. Two packages, on opposite sides of the build/run line:
#
#   topology/  dizzy-topology         BUILD time. Reads a feature-file and topology.yaml,
#                                     validates the placement, resolves it to placement
#                                     data. Depends on DIZZY.
#   engine/    dizzy-topology-engine  RUN time. Executes a resolved placement over the
#                                     Simple Engine store format. A runtime dependency of
#                                     apps built on DIZZY; never depends on DIZZY itself.
#
# Neither package depends on DIZZY's build tool. The engine builds on DIZZY's run-time
# packages (dizzy-kit, dizzy-engine), which an app vendors beside it. Here `just dizzy`
# fetches DIZZY at the commit pinned in the justfile (`dizzy_rev`) into .dizzy/ and
# copies them into vendor/python/, exactly as `dizzy generate wiring` copies them into an
# app's lib/python-uv/. (They cannot be git sources: their `workspace = true` sources
# fail outside a workspace.) `just foogle` and `just assay` run `dizzy generate` from the
# same checkout.
[project]
name = "dizzy-topology-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "topology",
    "engine",
    "vendor/python/dizzy-kit",
    "vendor/python/dizzy-engine",
]

[tool.uv.sources]
dizzy-topology = { workspace = true }
dizzy-topology-engine = { workspace = true }

[dependency-groups]
dev = [
    "dizzy-topology",
    "dizzy-topology-engine",
    "pytest>=8.4.2",
    "syrupy>=4.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["topology/tests", "engine/tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".dizzy",
    "vendor",
    # dizzy-quint's harness scripts keep their own (2-space) style.
    "spec",
    # Generated by `just gen-topology-pydantic` — edit def/topology.yaml instead.
    "topology/src/dizzy_topology/topology_schema.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["dizzy_topology", "dizzy_topology_engine"]
