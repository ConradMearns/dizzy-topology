id: https://example.org/models/ledger
name: ledger
description: >-
  The run ledger — runs, per-sample metrics and classifications, and the final
  summary
prefixes:
  linkml: https://w3id.org/linkml/
default_range: string
imports:
  - linkml:types
classes:
  AssayRun:
    description: A parsed run and its expected sample count
    attributes:
      run_id: { range: string, required: true, identifier: true }
      input_path: { range: string, required: true }
      plot_path: { range: string, required: true }
      sample_count: { range: integer, required: true }
  SampleMetric:
    description: One sample's computed metric
    attributes:
      sample_id: { range: string, required: true, identifier: true }
      run_id: { range: string, required: true }
      metric: { range: decimal, required: true }
  SampleClassification:
    description: One sample's classifier label and score
    attributes:
      sample_id: { range: string, required: true, identifier: true }
      run_id: { range: string, required: true }
      label: { range: string, required: true }
      score: { range: decimal, required: true }
  RunSummary:
    description: The aggregated result of a finished run
    attributes:
      run_id: { range: string, required: true, identifier: true }
      sample_count: { range: integer, required: true }
      analyzed_count: { range: integer, required: true }
      classified_count: { range: integer, required: true }
      mean_metric: { range: decimal, required: true }
      hit_count: { range: integer, required: true }
